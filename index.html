<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7b3fa0"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muna Jump">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="img/icon-192.png">
<title>Muna Jump</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fdf6e3;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#mute,#music{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:5;font-size:22px;width:44px;height:44px;border-radius:22px;border:0;background:#fff9;box-shadow:0 2px 6px #0003}
#music{right:62px}</style></head><body>
<canvas id="c"></canvas><button id="music" aria-label="Musik an/aus">🎵</button><button id="mute" aria-label="Ton an/aus">🔊</button>
<script src="game.js"></script>
<script>if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update());let d=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!d){d=1;location.reload()}})}</script>
</body></html>
